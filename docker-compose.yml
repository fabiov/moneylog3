services:
    db:
        image: postgres:16-alpine
        restart: always
        environment:
            POSTGRES_DB: moneylog
            POSTGRES_USER: moneylog
            POSTGRES_PASSWORD: moneylog_password
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
volumes:
    postgres_data:
        driver: local
